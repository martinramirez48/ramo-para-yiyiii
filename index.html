<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182629">
  <title>Un ramo para ti</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; overflow-x: hidden;
      display: grid; place-items: center;
      color: #fff5d7; font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 17% 13%, rgba(232, 190, 93, .13), transparent 20rem),
        radial-gradient(circle at 87% 80%, rgba(110, 155, 121, .12), transparent 27rem),
        linear-gradient(145deg, #101c21 0%, #202d30 48%, #1a222a 100%);
    }
    .scene { width: min(100%, 950px); min-height: 100svh; display: grid; place-items: center; padding: 20px 14px 28px; position: relative; isolation: isolate; }
    .scene::before, .scene::after { content: ""; position: absolute; border: 1px solid rgba(255, 238, 185, .13); border-radius: 999px; pointer-events: none; z-index: -1; }
    .scene::before { width: min(90vw, 720px); aspect-ratio: 1; }
    .scene::after { width: min(74vw, 570px); aspect-ratio: 1; border-color: rgba(126, 171, 146, .12); }
    .card { width: min(100%, 830px); text-align: center; position: relative; }
    .eyebrow { margin: 0 0 -9px; color: #d9bc73; font: 600 clamp(.58rem, 1.7vw, .72rem)/1.2 Arial, sans-serif; letter-spacing: .24em; opacity: 0; animation: appear .8s .2s forwards; }
    svg { width: 100%; max-height: min(76svh, 730px); overflow: visible; display: block; filter: drop-shadow(0 25px 35px rgba(0, 0, 0, .23)); }
    .message { margin: -5px auto 0; max-width: 710px; min-height: 2.5em; color: #fff0be; font-size: clamp(1.02rem, 2.8vw, 1.55rem); font-style: italic; line-height: 1.45; opacity: 0; transform: translateY(12px); animation: messageIn 1.7s 7.2s cubic-bezier(.2,.85,.25,1) forwards; }
    .hint { margin: 10px 0 0; color: rgba(232, 218, 179, .52); font: .64rem/1.4 Arial, sans-serif; letter-spacing: .09em; opacity: 0; animation: appear 1s 8.3s forwards; }
    .fall-petal { position: fixed; z-index: 4; width: 9px; height: 15px; border-radius: 85% 15% 85% 15%; pointer-events: none; background: linear-gradient(130deg, #fff0a6, #e7ad24); box-shadow: 0 0 7px rgba(255, 219, 95, .32); animation: fall var(--fall-time) linear forwards; }

    /* Las ramas se dibujan primero mediante el trazo discontinuo de cada path. */
    .stem { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: var(--path); stroke-dashoffset: var(--path); animation: drawStem 1.25s var(--delay) cubic-bezier(.25,.7,.2,1) forwards; }
    .twig { fill: none; stroke: #668b6d; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: drawStem .65s calc(var(--delay) + .35s) forwards; }
    .foliage { opacity: 0; animation: appear .5s var(--delay) forwards; }
    .leaf-body { transform-box: fill-box; transform-origin: center; animation: leafBreathe var(--breeze, 3.8s) calc(5.5s + var(--sway, 0s)) ease-in-out infinite alternate; }
    .eucalyptus .leaf-body { animation-duration: 5.4s; }
    .flower { opacity: 0; animation: flowerIn .55s var(--delay) cubic-bezier(.19,.84,.28,1) forwards, flowerSway 4.8s calc(6s + var(--sway, 0s)) ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; cursor: pointer; }
    .petal { transform-box: fill-box; transform-origin: 0 0; animation: petalBloom .65s calc(var(--delay) + var(--petal-delay)) cubic-bezier(.18,.9,.25,1) both; }
    .center-dot { opacity: 0; animation: appear .28s calc(var(--delay) + .44s) forwards; }
    .touch-halo { opacity: 0; transform-box: fill-box; transform-origin: center; pointer-events: none; }
    .flower.touched .touch-halo { animation: touchGlow .85s ease-out; }
    .bud { opacity: 0; animation: budIn .65s var(--delay) cubic-bezier(.2,.9,.25,1) forwards, flowerSway 4.5s calc(6.3s + var(--sway, 0s)) ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .spark { opacity: 0; animation: spark 2.8s calc(5.9s + var(--spark-delay)) ease-in-out infinite; }
    .ribbon { opacity: 0; animation: appear .7s 4.5s forwards; }
    @keyframes drawStem { to { stroke-dashoffset: 0; } }
    @keyframes appear { to { opacity: 1; } }
    @keyframes flowerIn { from { opacity: 0; transform: scale(.18) rotate(-8deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes petalBloom { from { transform: scale(.08); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes budIn { from { opacity: 0; transform: translateY(18px) scale(.2); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes leafBreathe { from { transform: rotate(-2deg) scale(.98); } to { transform: rotate(3.5deg) scale(1.025); } }
    @keyframes flowerSway { from { transform: rotate(-1.1deg) translateY(0); } to { transform: rotate(1.7deg) translateY(-1px); } }
    @keyframes spark { 0%,100% { opacity: 0; transform: scale(.4); } 45% { opacity: .95; transform: scale(1.15); } }
    @keyframes touchGlow { 0% { opacity: .9; transform: scale(.35); } 100% { opacity: 0; transform: scale(2.4); } }
    @keyframes messageIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes fall { from { transform: translate3d(0, -24px, 0) rotate(0); opacity: 0; } 9% { opacity: .88; } to { transform: translate3d(var(--drift), 110vh, 0) rotate(620deg); opacity: 0; } }
    @media (max-width: 520px) { .scene { padding-inline: 5px; } .message { padding-inline: 18px; } .hint { font-size: .56rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } .message, .eyebrow, .hint, .flower, .foliage, .bud, .ribbon { opacity: 1; } }
  </style>
</head>
<body>
  <main class="scene">
    <section class="card" aria-label="Ramo animado de flores amarillas">
      <p class="eyebrow">HECHO PARA FLORECER CONTIGO</p>
      <svg id="bouquet" viewBox="0 0 1000 850" role="img" aria-label="Ramo asimétrico de flores amarillas, eucalipto y papel crema"></svg>
      <p class="message">Yiyiii puuu carita de shampooooo te amooo, gracias por ser mi primavera eterna</p>
      <p class="hint">toca una flor para encender un pequeño brillo</p>
    </section>
  </main>

  <script>
    /*
      Todo el ramo se compone con SVG: no hay fotografías ni recursos externos.
      Los datos de cada flor controlan posición, tamaño, rotación y el momento
      de aparición, para conservar la irregularidad de un bouquet real.
    */
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.querySelector('#bouquet');
    const make = (tag, attrs = {}, parent = svg) => {
      const el = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      parent.appendChild(el); return el;
    };
    const group = (attrs = {}, parent = svg) => make('g', attrs, parent);
    const css = (el, vars) => Object.entries(vars).forEach(([key, value]) => el.style.setProperty(key, value));
    const seeded = (n) => { const x = Math.sin(n * 813.17) * 43758.5453; return x - Math.floor(x); };

    // Definiciones reutilizables: luz suave, papel, pétalos y centros con volumen.
    const defs = make('defs');
    const paper = make('linearGradient', { id: 'paper', x1: '0', y1: '0', x2: '1', y2: '1' }, defs);
    [['0%', '#fffbed'], ['52%', '#eadac0'], ['100%', '#cbb899']].forEach(([offset, color]) => make('stop', { offset, 'stop-color': color }, paper));
    const paperFold = make('linearGradient', { id: 'paperFold', x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
    [['0%', '#fdf7e9'], ['100%', '#bca888']].forEach(([offset, color]) => make('stop', { offset, 'stop-color': color }, paperFold));
    const center = make('radialGradient', { id: 'center' }, defs);
    [['0%', '#ffe78a'], ['48%', '#d99621'], ['100%', '#80431d']].forEach(([offset, color]) => make('stop', { offset, 'stop-color': color }, center));
    const glow = make('filter', { id: 'softGlow', x: '-80%', y: '-80%', width: '260%', height: '260%' }, defs);
    make('feGaussianBlur', { stdDeviation: '6', result: 'blur' }, glow);
    const merge = make('feMerge', {}, glow);
    make('feMergeNode', { in: 'blur' }, merge);
    make('feMergeNode', { in: 'SourceGraphic' }, merge);

    const back = group({ id: 'back-layer' });
    const stemsLayer = group({ id: 'stems-layer' });
    const foliageLayer = group({ id: 'foliage-layer' });
    const flowersBack = group({ id: 'flowers-back' });
    const flowersFront = group({ id: 'flowers-front' });
    const wrapLayer = group({ id: 'wrap-layer' });
    const sparksLayer = group({ id: 'sparks-layer' });

    // Traza una rama curva; el cálculo de longitud permite animarla como si creciera.
    function branch(d, delay, width = 5, color = '#365e48') {
      const path = make('path', { d, class: 'stem', stroke: color, 'stroke-width': width }, stemsLayer);
      const length = path.getTotalLength();
      css(path, { '--path': length, '--delay': `${delay}s` });
      return path;
    }
    function twig(d, delay) { const p = make('path', { d, class: 'twig' }, foliageLayer); css(p, { '--delay': `${delay}s` }); return p; }

    // Tallos principales, deliberadamente inclinados para evitar una silueta simétrica.
    [
      ['M495 704 C462 585 335 426 248 166', 0.00, 6.2],
      ['M505 704 C515 566 536 376 523 108', 0.18, 6.4],
      ['M508 704 C564 575 699 432 782 202', 0.32, 5.8],
      ['M490 704 C426 570 270 487 123 355', 0.54, 4.8],
      ['M512 704 C594 593 773 527 896 369', 0.67, 4.5],
      ['M500 704 C459 570 416 464 388 259', 0.80, 4.5],
      ['M505 704 C552 590 595 475 657 300', 0.96, 4.2]
    ].forEach(([d, delay, width]) => branch(d, delay, width));
    twig('M335 426 C276 393 235 359 203 312', .5); twig('M536 376 C615 336 685 305 724 250', .62);
    twig('M426 570 C351 547 286 521 237 476', .9); twig('M594 593 C667 565 732 530 789 474', 1.05);

    // Hojas elípticas y eucalipto redondeado: se añaden por encima de las ramas.
    function leaf(x, y, rx, ry, angle, fill, delay, eucalyptus = false, parent = foliageLayer) {
      const holder = group({ class: eucalyptus ? 'foliage eucalyptus' : 'foliage' }, parent);
      holder.setAttribute('transform', `translate(${x} ${y}) rotate(${angle})`);
      css(holder, { '--delay': `${delay}s`, '--sway': `${(seeded(x + y) * 1.7).toFixed(2)}s`, '--breeze': `${(3.2 + seeded(x * 4) * 2).toFixed(2)}s` });
      make('ellipse', { class: 'leaf-body', cx: 0, cy: -ry * .35, rx, ry, fill, stroke: eucalyptus ? '#5d8279' : '#3b6948', 'stroke-width': eucalyptus ? 1 : 1.4 }, holder);
      if (!eucalyptus) make('path', { d: `M0 ${ry * .7} L0 ${-ry * 1.05}`, stroke: '#c3d38f', 'stroke-width': 1, opacity: .65 }, holder);
    }
    const greens = [
      [200,333,12,34,-52], [247,281,11,30,-37], [285,404,14,38,-82], [365,491,15,42,-75],
      [380,369,12,35,42], [397,312,13,39,23], [439,436,15,43,75], [545,377,13,38,-42],
      [599,419,15,42,43], [666,353,13,39,37], [713,299,11,34,50], [740,447,15,43,58],
      [784,495,14,38,65], [827,390,12,34,50], [587,509,15,43,-66], [321,505,14,40,-54]
    ];
    greens.forEach((v, i) => {
      const delay = Math.min(2.2, i * .09 + .85);
      leaf(v[0], v[1], v[2], v[3], v[4], i % 3 ? '#4f7d52' : '#6e995f', delay);
    });
    const eucalyptus = [
      [154,302,19,23,-45], [184,267,22,26,16], [214,233,18,23,-26], [246,205,21,26,25],
      [725,255,21,26,-23], [761,226,18,23,25], [798,199,22,27,-17], [838,181,18,22,31],
      [632,207,19,24,-8], [655,168,17,22,21], [685,132,20,25,-18], [353,225,18,23,-29]
    ];
    eucalyptus.forEach((v, i) => leaf(v[0], v[1], v[2], v[3], v[4], '#8daaa0', 2.1 + i * .08, true));

    // Flor principal: pétalos curvados en dos coronas y centro con semillas.
    function flower(data, target = flowersFront) {
      const { x, y, size, rotate = 0, petals = 18, delay, palette, name } = data;
      const base = group({ transform: `translate(${x} ${y}) rotate(${rotate})` }, target);
      const bloom = group({ class: 'flower', 'aria-label': name || 'flor amarilla', tabindex: 0 }, base);
      css(bloom, { '--delay': `${delay}s`, '--sway': `${(seeded(x + y) * 2.2).toFixed(2)}s` });
      make('circle', { class: 'touch-halo', cx: 0, cy: 0, r: size * 1.08, fill: '#ffe680', filter: 'url(#softGlow)' }, bloom);
      for (let ring = 0; ring < 2; ring++) {
        const count = ring ? Math.round(petals * .72) : petals;
        for (let i = 0; i < count; i++) {
          // Irregularidad controlada: la naturaleza no distribuye todos los pétalos con precisión matemática.
          const angle = i * 360 / count + ring * 13 + (seeded(i + x) - .5) * 11;
          const scale = ring ? .73 : 1;
          // Separar giro y apertura evita que la animación CSS borre la rotación SVG.
          const oriented = group({ transform: `rotate(${angle}) scale(${scale})` }, bloom);
          const petal = group({ class: 'petal' }, oriented);
          css(petal, { '--delay': `${delay}s`, '--petal-delay': `${(ring * .12 + i * .028).toFixed(2)}s` });
          const wide = size * (ring ? .33 : .37) * (0.84 + seeded(i * 9 + y) * .25);
          const long = size * (ring ? .76 : 1.05) * (.9 + seeded(i * 5 + x) * .16);
          const petalColor = palette[(i + ring * 2) % palette.length];
          // Perfil de pétalo con hombros desiguales y punta suavemente doblada.
          make('path', { d: `M0 2 C${wide*.24} ${-long*.13}, ${wide*1.05} ${-long*.44}, ${wide*.58} ${-long*.78} C${wide*.34} ${-long*1.05}, ${-wide*.12} ${-long*1.13}, ${-wide*.52} ${-long*.88} C${-wide*1.08} ${-long*.52}, ${-wide*.28} ${-long*.12}, 0 2Z`, fill: petalColor, stroke: ring ? '#dca326' : '#d69d27', 'stroke-width': Math.max(.8, size * .018), 'stroke-linejoin': 'round' }, petal);
          // Dos veladuras finas imitan el pliegue y la luz que atraviesa un pétalo real.
          make('path', { d: `M0 -2 C${wide*.12} ${-long*.31}, ${wide*.13} ${-long*.59}, ${wide*.03} ${-long*.88}`, fill:'none', stroke:'#fff2ac', 'stroke-width':Math.max(.7,size*.013), opacity:.48, 'stroke-linecap':'round' }, petal);
          make('path', { d: `M${-wide*.16} ${-long*.16} C${-wide*.28} ${-long*.42}, ${-wide*.18} ${-long*.67}, ${-wide*.08} ${-long*.9}`, fill:'none', stroke:'#c98222', 'stroke-width':Math.max(.55,size*.01), opacity:.28, 'stroke-linecap':'round' }, petal);
        }
      }
      make('circle', { cx: 0, cy: 0, r: size * .43, fill: '#8b501e', opacity:.7 }, bloom);
      make('circle', { cx: 0, cy: 0, r: size * .39, fill: 'url(#center)', stroke: '#92511d', 'stroke-width': size * .035 }, bloom);
      for (let i = 0; i < Math.round(size * .9); i++) {
        const a = i * 2.39996, r = Math.sqrt(i / (size * .9)) * size * .28;
        const dot = make('circle', { class: 'center-dot', cx: Math.cos(a) * r, cy: Math.sin(a) * r, r: 1.25 + seeded(i + size) * 1.7, fill: i % 4 ? '#f7cf54' : '#74401d', stroke: i % 4 ? '#d99d27' : 'none', 'stroke-width': .45 }, bloom);
        css(dot, { '--delay': `${delay}s` });
      }
      const activate = () => { bloom.classList.remove('touched'); void bloom.getBoundingClientRect(); bloom.classList.add('touched'); };
      bloom.addEventListener('pointerdown', activate); bloom.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') activate(); });
    }

    const bright = ['#ffe88a', '#f8cf45', '#ffd75e', '#fff1ad', '#eeb32e'];
    const gold = ['#ffd161', '#f0a526', '#ffe494', '#e68a25', '#f5be3f'];
    const warm = ['#f8bd42', '#ef902c', '#ffd46b', '#e98229'];
    // Las flores traseras aportan profundidad; las delanteras son más grandes y abiertas.
    [
      {x:242,y:241,size:42,rotate:-16,petals:15,delay:3.55,palette:gold,name:'flor amarilla mediana'},
      {x:713,y:274,size:39,rotate:17,petals:14,delay:3.72,palette:bright,name:'flor amarilla mediana'},
      {x:384,y:239,size:43,rotate:-4,petals:16,delay:3.86,palette:warm,name:'flor dorada'},
      {x:650,y:195,size:36,rotate:8,petals:15,delay:4.02,palette:gold,name:'flor secundaria dorada'}
    ].forEach(f => flower(f, flowersBack));
    [
      {x:277,y:359,size:72,rotate:-17,petals:20,delay:4.24,palette:bright,name:'flor amarilla grande'},
      {x:505,y:281,size:81,rotate:4,petals:21,delay:4.52,palette:bright,name:'flor amarilla grande'},
      {x:694,y:378,size:69,rotate:16,petals:19,delay:4.79,palette:gold,name:'flor amarilla grande'},
      {x:423,y:432,size:60,rotate:-13,petals:18,delay:5.05,palette:gold,name:'flor amarilla grande'},
      {x:563,y:472,size:58,rotate:11,petals:18,delay:5.27,palette:warm,name:'flor amarillo anaranjado'},
      {x:779,y:457,size:45,rotate:24,petals:15,delay:5.42,palette:bright,name:'flor amarilla mediana'}
    ].forEach(f => flower(f));

    // Botones: pétalos todavía reunidos y sépalos verdes visibles.
    function bud(x, y, size, rotate, delay) {
      const base = group({ transform: `translate(${x} ${y}) rotate(${rotate})` }, flowersBack);
      const g = group({ class: 'bud' }, base); css(g, { '--delay': `${delay}s`, '--sway': `${seeded(x) * 2}s` });
      make('path', { d: `M0 5 C${-size*.55} ${-size*.12}, ${-size*.48} ${-size*.8}, 0 ${-size} C${size*.48} ${-size*.8}, ${size*.55} ${-size*.12}, 0 5Z`, fill:'#f6c940', stroke:'#d99b25', 'stroke-width':2 }, g);
      make('path', { d:`M${-size*.43} 2 L0 ${-size*.26} L${size*.43} 2 L0 ${size*.31}Z`, fill:'#4d7850', stroke:'#315c43', 'stroke-width':1.5 }, g);
      make('path', { d:`M0 ${size*.25} C0 ${size*.55}, 2 ${size*.76}, 5 ${size*1.15}`, fill:'none', stroke:'#376047', 'stroke-width':3.5, 'stroke-linecap':'round' }, g);
    }
    bud(180, 258, 32, -18, 3.38); bud(786, 231, 29, 20, 3.58);

    // Pequeñas flores blancas, ramitas de relleno y bolitas amarillas agrupadas.
    function smallFlower(x, y, s, delay, fill = '#fff9df', parent = flowersBack) {
      const g = group({ class:'flower', transform:`translate(${x} ${y})` }, parent); css(g, {'--delay':`${delay}s`, '--sway':`${seeded(y)*2}s`});
      for(let i=0;i<5;i++) { const direction=group({transform:`rotate(${i*72})`},g); const p=group({class:'petal'},direction); css(p,{'--delay':`${delay}s`, '--petal-delay':`${i*.04}s`}); make('ellipse',{cx:0,cy:-s*.7,rx:s*.34,ry:s*.67,fill,stroke:'#e7ddbd','stroke-width':.8},p); }
      make('circle',{cx:0,cy:0,r:s*.3,fill:'#e8b948'},g);
    }
    [[144,378],[172,357],[196,391],[219,365],[152,414],[825,326],[849,350],[879,337],[807,357],[866,385],[338,177],[361,156]].forEach((p,i)=>smallFlower(p[0],p[1],9+(i%3),3.04+i*.07));
    function yellowSpray(points, delay) {
      points.forEach(([x,y],i)=> { const g=group({class:'foliage'},flowersBack); css(g,{'--delay':`${delay+i*.06}s`}); make('circle',{cx:x,cy:y,r:7+(i%2)*2,fill:i%3?'#f6c943':'#e7a830',stroke:'#cc8525','stroke-width':1},g); make('circle',{cx:x-2,cy:y-2,r:2.2,fill:'#fff0a2',opacity:.72},g); });
    }
    yellowSpray([[709,146],[731,160],[750,143],[767,168],[785,151],[805,175],[738,184]],3.10);
    yellowSpray([[299,153],[318,134],[336,149],[352,126],[367,145]],3.22);

    // Papel crema y lazo, colocados al final para envolver visualmente los tallos.
    make('path', { d:'M266 577 L490 674 L740 570 L825 717 Q501 824 175 716Z', fill:'url(#paper)', stroke:'#c9b795', 'stroke-width':3, opacity:.98 }, wrapLayer);
    make('path', { d:'M175 716 L266 577 L475 711 L338 773Z', fill:'url(#paperFold)', stroke:'#d3c0a1', 'stroke-width':2 }, wrapLayer);
    make('path', { d:'M825 717 L740 570 L526 709 L667 775Z', fill:'url(#paperFold)', stroke:'#d3c0a1', 'stroke-width':2 }, wrapLayer);
    make('path', { d:'M266 577 L490 674 L740 570', fill:'none', stroke:'#fffdf3', 'stroke-width':4, opacity:.65 }, wrapLayer);
    const ribbon = group({ class:'ribbon', transform:'translate(495 713)' }, wrapLayer);
    make('path',{d:'M0 0 C-47-48-97-26-74 11 C-54 42-17 21 0 4 C17 21 54 42 74 11 C97-26 47-48 0 0Z',fill:'#bd6571',stroke:'#f0b5b5','stroke-width':2},ribbon);
    make('circle',{cx:0,cy:4,r:12,fill:'#a94b5e',stroke:'#f3c6bd','stroke-width':2},ribbon);
    make('path',{d:'M-10 13 L-38 75 L2 44 L29 75 L14 12Z',fill:'#ae5366',stroke:'#ecabb0','stroke-width':1.5},ribbon);

    // Destellos discretos alrededor del bouquet, nunca sustituyen las flores.
    [[95,238],[114,526],[217,112],[462,107],[857,131],[904,283],[883,573],[753,91],[82,445],[611,91]].forEach(([x,y],i)=>{
      const g=group({class:'spark',transform:`translate(${x} ${y})`},sparksLayer); css(g,{'--spark-delay':`${(i*.31).toFixed(2)}s`});
      make('path',{d:'M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z',fill:'#fff0aa'},g);
    });

    // Tras terminar de formar el ramo, caen pétalos ocasionales sobre toda la página.
    function fallingPetal() {
      const p = document.createElement('i'); p.className = 'fall-petal';
      p.style.left = `${12 + Math.random() * 76}vw`;
      p.style.top = `${-10 - Math.random() * 12}px`;
      p.style.setProperty('--drift', `${-80 + Math.random() * 160}px`);
      p.style.setProperty('--fall-time', `${5 + Math.random() * 3}s`);
      document.body.append(p); p.addEventListener('animationend', () => p.remove());
    }
    setTimeout(() => { fallingPetal(); setInterval(fallingPetal, 2500); }, 6800);
  </script>
</body>
</html>
